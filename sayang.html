<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masihhh Sayanggg? 🤍</title>

<style>
body{
margin:0;
background:#fff0f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
overflow:hidden;
}

.box{
text-align:center;
}

h1{
color:#ff4f87;
margin-bottom:40px;
}

button{
padding:12px 28px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin:10px;
transition:.2s;
}

#iya{
background:#ff4f87;
color:white;
}

#enggak{
background:white;
border:2px solid #ff4f87;
color:#ff4f87;
position:absolute;
}
</style>
</head>

<body>

<div class="box">
<h1>Cayanggg masih sayang aku nggak? 🥺🤍</h1>

<button id="iya" onclick="lanjut()">Iya 💖</button>

<button id="enggak">Enggak 🙄</button>

</div>

<script>

function lanjut(){
window.location.href="foto.html";
}

const no=document.getElementById("enggak");

no.addEventListener("mouseover",()=>{
let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";
no.style.top=y+"px";
});

</script>

</body>
</html>
